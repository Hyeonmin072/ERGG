name: Biweekly Games Truncate

on:
  schedule:
    # 매주 목요일 KST 12:00 (UTC 목요일 03:00)에 실행 후, 스크립트가 14일 주기인지 판단
    - cron: "0 3 * * 4"
  workflow_dispatch:

jobs:
  truncate:
    name: Truncate games every 14 days from 2026-04-30
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Truncate games table on biweekly Thursdays
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python truncate_games_biweekly.py
